<!doctype html>
<!-- 前端演示页：展示车联网组件拓扑、数据流和后端决策步骤。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IMSDT-VEC 前端演示</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">I</span>
        <div>
          <strong>IMSDT-VEC</strong>
          <span id="scenarioFocus">紧急任务</span>
        </div>
      </div>
      <div class="scenario-tabs" aria-label="场景选择">
        <button class="scenario-button" data-scenario="normal">普通</button>
        <button class="scenario-button" data-scenario="low_energy">低能耗</button>
        <button class="scenario-button" data-scenario="emergency">紧急</button>
        <button class="scenario-button" data-scenario="high_load">高负载</button>
      </div>
      <div class="controls">
        <button id="prevStep" class="icon-button" title="上一步">‹</button>
        <button id="playToggle" class="icon-button primary" title="播放">▶</button>
        <button id="nextStep" class="icon-button" title="下一步">›</button>
        <button id="rerun" class="text-button">运行</button>
        <button id="resetMemory" class="text-button subtle">清空记忆</button>
      </div>
    </header>

    <main class="workspace">
      <section class="panel left-panel" aria-label="组件属性">
        <div class="panel-header">
          <h1 id="scenarioTitle">紧急优先</h1>
          <span id="caseCount" class="status-pill">案例 0</span>
        </div>
        <div class="metric-grid" id="summaryMetrics"></div>
        <div class="section-title">组件</div>
        <div id="componentList" class="component-list"></div>
        <div class="section-title">属性</div>
        <div id="propertyTable" class="property-table"></div>
      </section>

      <section class="map-panel" aria-label="车联网拓扑">
        <div class="map-toolbar">
          <div>
            <strong id="stepTitle">场景状态</strong>
            <span id="stepIndex">1 / 10</span>
          </div>
          <div id="selectedTarget" class="status-pill accent">local</div>
        </div>
        <div id="networkMap" class="network-map">
          <svg id="roadLayer" class="road-layer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <svg id="linkLayer" class="link-layer" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
          <div id="nodeLayer" class="node-layer"></div>
          <div id="fleetLayer" class="fleet-layer"></div>
        </div>
        <div id="stepRail" class="step-rail"></div>
      </section>

      <section class="panel right-panel" aria-label="决策过程">
        <div class="panel-header">
          <h2>决策过程</h2>
          <span id="memoryHits" class="status-pill">命中 0</span>
        </div>
        <p id="stepSummary" class="step-summary"></p>
        <div id="stepDetails" class="detail-list"></div>
        <div id="stepMetrics" class="bar-stack"></div>

        <div class="section-title">候选方案</div>
        <div class="table-wrap">
          <table class="candidate-table">
            <thead>
              <tr>
                <th>目标</th>
                <th>时延</th>
                <th>能耗</th>
                <th>可靠性</th>
                <th>满足度</th>
              </tr>
            </thead>
            <tbody id="candidateRows"></tbody>
          </table>
        </div>

        <div class="section-title">执行反馈</div>
        <div id="executionPanel" class="execution-panel"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
